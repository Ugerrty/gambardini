<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>GAMBARDINI ЛАЙТ — крючок самоклеящийся тройной</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&amp;family=Manrope:wght@400..800&amp;display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body { overflow: hidden; background: #E5DCC7; }

  :root{
    --bg: #F2EDE4;
    --bg-2: #EAE3D4;
    --bg-3: #E2D9C6;
    --ink: #2B2118;
    --noce: #5C4432;
    --brass: #B08D57;
    --brass-ink: #8F6B33;
    --muted: #7D6F5C;
  }

  #card{
    position: relative;
    width: 900px;
    height: 1200px;
    overflow: hidden;
    font-family: 'Manrope', 'Segoe UI', Arial, sans-serif;
    font-feature-settings: "kern";
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
    color: var(--ink);
    /* Травертин: свет сверху-слева, виньетка, слоистые страты */
    background-image:
      radial-gradient(1050px 780px at 22% 6%, rgba(255,252,244,.72), rgba(255,252,244,0) 62%),
      radial-gradient(1050px 940px at 86% 102%, rgba(92,68,50,.12), rgba(92,68,50,0) 64%),
      linear-gradient(180deg,
        #F1EBDF 0%,   #EFE8DA 7.5%, #E9E1D0 9%,
        #EEE7D8 18%,  #E5DDCA 19.6%,
        #EFE9DC 30%,  #E8E0CE 31.4%,
        #EDE6D6 42%,  #E3DAC5 43.6%,
        #EEE8DA 56%,  #E7DFCC 57.4%,
        #ECE5D4 68%,  #E2D8C2 69.8%,
        #EDE7D8 80%,  #E6DECA 81.4%,
        #EBE4D3 92%,  #E4DBC6 100%);
  }

  #card > *{ position: absolute; }

  /* ---------- каменные прожилки (тонкие, с неровным горизонтальным затуханием) ---------- */
  .veins{
    inset: 0;
    background-image:
      linear-gradient(90deg, rgba(122,100,76,0) 4%,  rgba(122,100,76,.07)  20%, rgba(122,100,76,.028) 52%, rgba(122,100,76,.06)  74%, rgba(122,100,76,0) 96%),
      linear-gradient(90deg, rgba(255,255,255,0) 8%, rgba(255,255,255,.28) 42%, rgba(255,255,255,0) 90%),
      linear-gradient(90deg, rgba(122,100,76,0) 0%,  rgba(122,100,76,.078) 28%, rgba(122,100,76,.03)  60%, rgba(122,100,76,0) 90%),
      linear-gradient(90deg, rgba(255,255,255,0) 5%, rgba(255,255,255,.26) 50%, rgba(255,255,255,0) 94%),
      linear-gradient(90deg, rgba(122,100,76,0) 8%,  rgba(122,100,76,.072) 34%, rgba(122,100,76,.026) 70%, rgba(122,100,76,0) 98%),
      linear-gradient(90deg, rgba(255,255,255,0) 12%,rgba(255,255,255,.27) 44%, rgba(255,255,255,0) 96%),
      linear-gradient(90deg, rgba(122,100,76,0) 2%,  rgba(122,100,76,.062) 18%, rgba(122,100,76,.03)  46%, rgba(122,100,76,.068) 82%, rgba(122,100,76,0) 97%),
      linear-gradient(90deg, rgba(255,255,255,0) 4%, rgba(255,255,255,.25) 58%, rgba(255,255,255,0) 92%);
    background-size: 100% 1px, 100% 1px, 100% 1px, 100% 1px, 100% 1px, 100% 1px, 100% 1px, 100% 1px;
    background-position: 0 168px, 0 169px, 0 438px, 0 439px, 0 806px, 0 807px, 0 992px, 0 993px;
    background-repeat: no-repeat;
  }

  /* ---------- каменный шум: растянутые по горизонтали страты ---------- */
  .stone-noise{
    inset: 0;
    opacity: .05;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='900' height='1200'><filter id='s'><feTurbulence type='fractalNoise' baseFrequency='0.005 0.032' numOctaves='4' seed='4' stitchTiles='stitch'/><feColorMatrix type='matrix' values='0 0 0 0 0.36 0 0 0 0 0.27 0 0 0 0 0.19 0 0 0 0.55 0'/></filter><rect width='900' height='1200' filter='url(%23s)'/></svg>");
    background-size: 900px 1200px;
    background-repeat: no-repeat;
  }

  /* ---------- диагональный дневной свет ---------- */
  .daylight{
    inset: 0;
    background: linear-gradient(118deg, rgba(255,251,242,.42) 0%, rgba(255,251,242,.1) 34%, rgba(255,251,242,0) 52%);
  }

  /* ---------- световая подложка под заголовочным блоком ---------- */
  .wash{
    left: 0; right: 0; top: -30px; height: 520px;
    background: radial-gradient(58% 54% at 50% 40%, rgba(250,246,237,.88), rgba(250,246,237,0) 72%);
  }

  /* ---------- латунная рамка-кейлайн ---------- */
  .frame{
    inset: 26px;
    border: 1px solid rgba(176,141,87,.38);
    pointer-events: none;
  }

  /* ---------- шапка ---------- */
  header{
    top: 64px; left: 0; right: 0;
    text-align: center;
  }
  .wordmark{
    font-family: 'Bodoni Moda', 'Times New Roman', serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: 21px;
    line-height: 1;
    letter-spacing: .34em;
    text-indent: .34em;
    color: var(--noce);
  }
  .rule-row{
    margin-top: 15px;
    display: flex; align-items: center; justify-content: center; gap: 13px;
  }
  .rule-row i{
    display: block; width: 88px; height: 1px;
    background: linear-gradient(90deg, rgba(176,141,87,0), rgba(176,141,87,.75));
  }
  .rule-row i:last-child{
    background: linear-gradient(90deg, rgba(176,141,87,.75), rgba(176,141,87,0));
  }
  .rule-row b{
    display: block; width: 5px; height: 5px;
    background: var(--brass);
    transform: rotate(45deg);
  }
  .series{
    margin-top: 13px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .14em;
    text-indent: .14em;
    color: var(--brass-ink);
  }

  /* ---------- заголовочный блок ---------- */
  .hero{
    top: 166px; left: 64px; right: 64px;
    text-align: center;
  }
  .pname{
    font-size: 26px;
    font-weight: 500;
    line-height: 1.25;
    letter-spacing: .004em;
    color: var(--ink);
  }
  .hero h1{
    margin: 13px 0 0;
    font-family: 'Bodoni Moda', 'Times New Roman', serif;
    font-optical-sizing: auto;
    font-weight: 500;
    font-size: 94px;
    line-height: .98;
    letter-spacing: .002em;
    color: var(--ink);
  }
  .sub{
    margin-top: 17px;
    font-family: 'Bodoni Moda', 'Times New Roman', serif;
    font-optical-sizing: auto;
    font-style: italic;
    font-weight: 500;
    font-size: 31px;
    line-height: 1.15;
    color: var(--brass-ink);
  }

  /* ---------- вертикальный коннектор ---------- */
  .connector{
    left: calc(50% - .5px); top: 404px;
    width: 1px; height: 58px;
    background: linear-gradient(180deg, rgba(176,141,87,0), rgba(176,141,87,.55) 32%, rgba(176,141,87,.55) 68%, rgba(176,141,87,0));
  }

  /* ---------- сцена (SVG на всю карту) ---------- */
  svg.scene{ inset: 0; width: 900px; height: 1200px; }

  .engrave-lo, .engrave-hi{
    font-family: 'Bodoni Moda', 'Times New Roman', serif;
    font-weight: 600;
    font-size: 9.5px;
    letter-spacing: 2.6px;
  }
  .engrave-lo{ fill: rgba(255,255,255,.85); }
  .engrave-hi{ fill: rgba(104,90,72,.58); }

  /* ---------- аннотация у планки ---------- */
  .annot{
    left: 200px; top: 757px;
    display: flex; align-items: center; gap: 11px;
  }
  .annot i{
    display: block; width: 26px; height: 1px;
    background: rgba(176,141,87,.8);
  }
  .annot span{
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: .1em;
    color: var(--noce);
    white-space: nowrap;
  }

  /* ---------- капсулы фактов ---------- */
  .chips{
    left: 64px; right: 64px; top: 1008px;
    display: flex; justify-content: center; gap: 12px;
  }
  .chip{
    display: inline-flex; align-items: center; gap: 9px;
    height: 45px; padding: 0 19px;
    border-radius: 23px;
    background: linear-gradient(180deg, #FBF7EE, #F2EBDC);
    border: 1px solid rgba(176,141,87,.5);
    box-shadow: 0 12px 22px -14px rgba(74,56,38,.42);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .09em;
    color: var(--noce);
    white-space: nowrap;
  }
  .chip svg{ display: block; flex: none; stroke: var(--brass-ink); fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- свотчи цветов ---------- */
  .swatches{
    left: 0; right: 0; top: 1072px;
    display: flex; justify-content: center; align-items: flex-start; gap: 26px;
  }
  .sw-label{
    display: flex; align-items: center; gap: 11px;
    height: 20px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .12em;
    color: var(--brass-ink);
    white-space: nowrap;
  }
  .sw-label i{
    display: block; width: 24px; height: 1px;
    background: rgba(176,141,87,.7);
  }
  .sw{
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    width: 62px;
  }
  .sw b{
    display: block; width: 20px; height: 20px; border-radius: 50%;
    border: 1px solid rgba(43,33,24,.22);
    box-shadow: 0 2px 5px rgba(74,56,38,.24), inset 0 1px 1px rgba(255,255,255,.25);
    box-sizing: border-box;
  }
  .sw span{
    font-size: 11.5px;
    font-weight: 500;
    line-height: 1;
    color: #6A5D49;
  }
  .sw-white  b{ background: #FFFFFF; }
  .sw-black  b{ background: #1A1A1A; }
  .sw-graph  b{ background: #6E6E6E; }
  .sw-champ  b{ background: #D6B36A; }

  /* ---------- финальное зерно ---------- */
  .grain{
    inset: 0;
    opacity: .05;
    pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' seed='11' stitchTiles='stitch'/><feColorMatrix type='matrix' values='0 0 0 0 0.24 0 0 0 0 0.18 0 0 0 0 0.12 0 0 0 0.55 0'/></filter><rect width='240' height='240' filter='url(%23g)'/></svg>");
    background-size: 240px 240px;
  }
</style>
</head>
<body>

<div id="card">

  <div class="veins"></div>
  <div class="stone-noise"></div>
  <div class="daylight"></div>
  <div class="wash"></div>
  <div class="frame"></div>

  <!-- ================= СЦЕНА: планка, крючки, полотенце ================= -->
  <svg class="scene" viewBox="0 0 900 1200" aria-hidden="true">
    <defs>
      <linearGradient id="plateFace" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0"   stop-color="#FDFCF9"/>
        <stop offset=".12" stop-color="#FAF8F3"/>
        <stop offset=".5"  stop-color="#F3F0E9"/>
        <stop offset=".88" stop-color="#E9E4D8"/>
        <stop offset="1"   stop-color="#E1DBCC"/>
      </linearGradient>
      <linearGradient id="sheenG" x1="0" y1="0" x2="1" y2=".35">
        <stop offset="0"   stop-color="#FFFFFF" stop-opacity=".68"/>
        <stop offset=".35" stop-color="#FFFFFF" stop-opacity=".12"/>
        <stop offset=".62" stop-color="#FFFFFF" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="edgeG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0"   stop-color="#FFFFFF" stop-opacity=".95"/>
        <stop offset=".28" stop-color="#FFFFFF" stop-opacity=".2"/>
        <stop offset=".6"  stop-color="#8A7860" stop-opacity=".06"/>
        <stop offset="1"   stop-color="#584834" stop-opacity=".3"/>
      </linearGradient>
      <radialGradient id="discFace" cx=".38" cy=".32" r=".85">
        <stop offset="0"   stop-color="#FFFFFF"/>
        <stop offset=".45" stop-color="#F6F3EC"/>
        <stop offset=".8"  stop-color="#EAE5D8"/>
        <stop offset="1"   stop-color="#DBD4C3"/>
      </radialGradient>
      <linearGradient id="rimG" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/>
        <stop offset=".5" stop-color="#A09280" stop-opacity=".22"/>
        <stop offset="1" stop-color="#5F5040" stop-opacity=".42"/>
      </linearGradient>
      <linearGradient id="grooveG" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#5F5040" stop-opacity=".42"/>
        <stop offset=".5" stop-color="#A09280" stop-opacity=".18"/>
        <stop offset="1" stop-color="#FFFFFF" stop-opacity=".9"/>
      </linearGradient>
      <radialGradient id="domeHi" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#FFFFFF" stop-opacity=".8"/>
        <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="towelBody" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0"   stop-color="#E7DCC4"/>
        <stop offset=".08" stop-color="#F2EAD8"/>
        <stop offset=".17" stop-color="#E1D5BA"/>
        <stop offset=".26" stop-color="#EFE6D2"/>
        <stop offset=".37" stop-color="#E5D9C0"/>
        <stop offset=".46" stop-color="#F3EBDA"/>
        <stop offset=".56" stop-color="#E2D6BC"/>
        <stop offset=".66" stop-color="#EEE4D0"/>
        <stop offset=".77" stop-color="#E0D3B8"/>
        <stop offset=".87" stop-color="#EFE7D6"/>
        <stop offset="1"   stop-color="#DDD0B5"/>
      </linearGradient>
      <linearGradient id="towelShade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0"   stop-color="#5C4432" stop-opacity=".18"/>
        <stop offset=".14" stop-color="#5C4432" stop-opacity=".04"/>
        <stop offset=".8"  stop-color="#5C4432" stop-opacity="0"/>
        <stop offset="1"   stop-color="#5C4432" stop-opacity=".13"/>
      </linearGradient>

      <filter id="b16" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
      <filter id="b8"  x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
      <filter id="b4"  x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3.5"/></filter>
      <filter id="b2"  x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.6"/></filter>

      <g id="disc">
        <circle r="41" fill="url(#discFace)"/>
        <circle r="41" fill="none" stroke="url(#rimG)" stroke-width="1.3" opacity=".9"/>
        <circle r="30" fill="none" stroke="url(#grooveG)" stroke-width="1.6"/>
        <circle r="26.5" fill="none" stroke="#FFFFFF" stroke-width=".8" opacity=".45"/>
        <ellipse cx="-9" cy="-11" rx="20" ry="15" fill="url(#domeHi)" opacity=".75"/>
      </g>
    </defs>

    <!-- мягкая тень планки на стену (свет сверху-слева) -->
    <rect x="216" y="582" width="480" height="150" rx="20" fill="#4A3826" opacity=".26" filter="url(#b16)"/>
    <rect x="208" y="700" width="466" height="24" rx="12" fill="#4A3826" opacity=".2" filter="url(#b8)"/>

    <!-- планка 480x150, r18 -->
    <rect x="200" y="560" width="480" height="150" rx="18" fill="url(#plateFace)"/>
    <rect x="200" y="560" width="480" height="150" rx="18" fill="url(#sheenG)" opacity=".55"/>
    <rect x="200.7" y="560.7" width="478.6" height="148.6" rx="17.4" fill="none" stroke="url(#edgeG)" stroke-width="1.4"/>

    <!-- гравировка слева -->
    <text class="engrave-lo" x="228" y="699.8">GAMBARDINI</text>
    <text class="engrave-hi" x="228" y="699">GAMBARDINI</text>

    <!-- тени дисков на планке -->
    <ellipse cx="309" cy="641" rx="42" ry="40" fill="#4A3826" opacity=".15" filter="url(#b4)"/>
    <ellipse cx="444" cy="641" rx="42" ry="40" fill="#4A3826" opacity=".15" filter="url(#b4)"/>
    <ellipse cx="579" cy="641" rx="42" ry="40" fill="#4A3826" opacity=".15" filter="url(#b4)"/>

    <!-- три крючка-пина -->
    <use href="#disc" x="305" y="635"/>
    <use href="#disc" x="440" y="635"/>
    <use href="#disc" x="575" y="635"/>

    <!-- тень полотенца на стену и планку -->
    <path transform="translate(15 19)" fill="#4A3826" opacity=".2" filter="url(#b8)"
      d="M 543 642 C 541 615 553 598 575 597 C 597 598 609 615 607 642
         C 611 662 615 672 619 690 C 630 720 640 760 642 806
         C 644 862 641 916 638 946 C 636 960 612 965 575 965
         C 538 965 514 960 512 946 C 509 916 506 862 508 806
         C 510 760 520 720 531 690 C 535 672 539 662 543 642 Z"/>

    <!-- льняное полотенце на правом пине -->
    <path fill="url(#towelBody)"
      d="M 543 642 C 541 615 553 598 575 597 C 597 598 609 615 607 642
         C 611 662 615 672 619 690 C 630 720 640 760 642 806
         C 644 862 641 916 638 946 C 636 960 612 965 575 965
         C 538 965 514 960 512 946 C 509 916 506 862 508 806
         C 510 760 520 720 531 690 C 535 672 539 662 543 642 Z"/>
    <path fill="url(#towelShade)"
      d="M 543 642 C 541 615 553 598 575 597 C 597 598 609 615 607 642
         C 611 662 615 672 619 690 C 630 720 640 760 642 806
         C 644 862 641 916 638 946 C 636 960 612 965 575 965
         C 538 965 514 960 512 946 C 509 916 506 862 508 806
         C 510 760 520 720 531 690 C 535 672 539 662 543 642 Z"/>

    <!-- складки -->
    <path d="M 549 668 C 545 760 546 860 550 946" fill="none" stroke="#5C4432" stroke-opacity=".1" stroke-width="10" filter="url(#b4)"/>
    <path d="M 598 672 C 602 770 601 870 597 944" fill="none" stroke="#5C4432" stroke-opacity=".09" stroke-width="13" filter="url(#b4)"/>
    <path d="M 572 660 C 570 770 571 870 573 950" fill="none" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="8" filter="url(#b4)"/>
    <!-- свет по левому краю -->
    <path d="M 543 646 C 537 700 509 760 508 806 C 506 862 509 916 512 946" fill="none" stroke="#FFFFFF" stroke-opacity=".38" stroke-width="2.4" filter="url(#b2)"/>
    <!-- перегиб над пином -->
    <path d="M 546 648 C 560 656 590 656 604 648" fill="none" stroke="#5C4432" stroke-opacity=".16" stroke-width="8" filter="url(#b4)"/>
    <path d="M 551 604 C 560 599 590 599 599 604" fill="none" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="2.2" filter="url(#b2)"/>
    <!-- подшитая кромка -->
    <path d="M 514 938 C 542 944 608 944 636 938" fill="none" stroke="#5C4432" stroke-opacity=".18" stroke-width="1.2"/>
    <path d="M 514 941 C 542 947 608 947 636 941" fill="none" stroke="#FFFFFF" stroke-opacity=".4" stroke-width="1"/>
  </svg>

  <!-- ================= редакционный слой ================= -->

  <header>
    <div class="wordmark">GAMBARDINI</div>
    <div class="rule-row"><i></i><b></b><i></i></div>
    <div class="series">СЕРИЯ ЛАЙТ</div>
  </header>

  <div class="hero">
    <div class="pname">Крючок самоклеящийся тройной</div>
    <h1>Без&nbsp;сверления</h1>
    <div class="sub">выдерживает до&nbsp;5&nbsp;кг</div>
  </div>

  <div class="connector"></div>

  <div class="annot">
    <i></i><span>САМОКЛЕЯЩЕЕСЯ КРЕПЛЕНИЕ</span>
  </div>

  <div class="chips">
    <div class="chip">
      <svg width="20" height="20" viewBox="0 0 20 20">
        <path d="M2.9 13.2 L7.7 7.2 H17 L12.2 13.2 Z"/>
        <path d="M2.9 13.2 v2.3 h9.3 v-2.3"/>
      </svg>
      СТАЛЬ AISI&nbsp;304 · 1&nbsp;ММ
    </div>
    <div class="chip">
      <svg width="20" height="20" viewBox="0 0 20 20">
        <path d="M6.9 8 a3.1 3.1 0 1 1 6.2 0"/>
        <path d="M5.3 8 h9.4 l1.5 6.1 a1.7 1.7 0 0 1 -1.7 2 H5.5 a1.7 1.7 0 0 1 -1.7 -2 Z"/>
      </svg>
      НАГРУЗКА ДО&nbsp;5&nbsp;КГ
    </div>
    <div class="chip">
      <svg width="20" height="20" viewBox="0 0 20 20">
        <path d="M10 3.4 L15.7 10 L10 16.6 L4.3 10 Z"/>
        <circle cx="10" cy="10" r="1.1"/>
      </svg>
      СДЕЛАНО В&nbsp;РОССИИ
    </div>
  </div>

  <div class="swatches">
    <div class="sw-label">4&nbsp;ЦВЕТА<i></i></div>
    <div class="sw sw-white"><b></b><span>белый</span></div>
    <div class="sw sw-black"><b></b><span>чёрный</span></div>
    <div class="sw sw-graph"><b></b><span>графит</span></div>
    <div class="sw sw-champ"><b></b><span>шампань</span></div>
  </div>

  <div class="grain"></div>

</div>

</body>
</html>
